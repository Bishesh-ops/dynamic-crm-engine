{{ template "base" . }}

{{ define "content" }}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Dynamic Schema Builder</h1>
    
    <div class="bg-white shadow rounded-lg p-6">
        <form id="schemaForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">Schema Name</label>
                <input type="text" id="schemaName" required placeholder="e.g., leads, accounts, tickets" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <label class="block text-sm font-medium text-gray-700">Schema Fields</label>
                    <button type="button" onclick="addField()" class="bg-gray-100 text-gray-700 px-3 py-1 rounded border hover:bg-gray-200 text-sm transition">
                        + Add Field
                    </button>
                </div>
                
                <div id="fieldsContainer" class="space-y-3">
                    <div class="flex gap-4 items-center field-row bg-gray-50 p-3 rounded border border-gray-200">
                        <input type="text" placeholder="Field Name (e.g., company)" required class="flex-1 rounded-md border-gray-300 shadow-sm p-2 border field-name">
                        
                        <select class="rounded-md border-gray-300 shadow-sm p-2 border field-type bg-white w-40">
                            <option value="string">String</option>
                            <option value="int">Integer</option>
                            <option value="float">Float</option>
                            <option value="object">Object (JSON)</option>
                        </select>
                        
                        <label class="flex items-center gap-2 text-sm text-gray-600 w-24">
                            <input type="checkbox" class="field-required rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            Required
                        </label>

                        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2 font-bold">&times;</button>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t flex justify-between items-center">
                <p id="statusMessage" class="text-sm font-medium"></p>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition font-medium">
                    Deploy Schema
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function addField() {
        const container = document.getElementById('fieldsContainer');
        const row = document.createElement('div');
        row.className = 'flex gap-4 items-center field-row bg-gray-50 p-3 rounded border border-gray-200';
        row.innerHTML = `
            <input type="text" placeholder="Field Name" required class="flex-1 rounded-md border-gray-300 shadow-sm p-2 border field-name">
            <select class="rounded-md border-gray-300 shadow-sm p-2 border field-type bg-white w-40">
                <option value="string">String</option>
                <option value="int">Integer</option>
                <option value="float">Float</option>
                <option value="object">Object (JSON)</option>
            </select>
            <label class="flex items-center gap-2 text-sm text-gray-600 w-24">
                <input type="checkbox" class="field-required rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                Required
            </label>
            <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2 font-bold">&times;</button>
        `;
        container.appendChild(row);
    }

    document.getElementById('schemaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('statusMessage');
        statusEl.textContent = 'Deploying...';
        statusEl.className = 'text-sm font-medium text-gray-500';

        const payload = {
            name: document.getElementById('schemaName').value.trim().toLowerCase(),
            fields: {}
        };

        document.querySelectorAll('.field-row').forEach(row => {
            const name = row.querySelector('.field-name').value.trim().toLowerCase();
            const type = row.querySelector('.field-type').value;
            const required = row.querySelector('.field-required').checked;
            
            if (name) {
                payload.fields[name] = { type: type, required: required };
            }
        });

        try {
            const response = await fetch('/api/schemas', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-API-Key': '{{ .APIKey }}'
                 },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                statusEl.textContent = 'Success! Schema deployed to engine.';
                statusEl.className = 'text-sm font-medium text-green-600';
                e.target.reset(); // Clear the form
            } else {
                statusEl.textContent = 'Error: ' + (data.error || 'Failed to deploy schema');
                statusEl.className = 'text-sm font-medium text-red-600';
            }
        } catch (err) {
            statusEl.textContent = 'Network error occurred.';
            statusEl.className = 'text-sm font-medium text-red-600';
        }
    });
</script>
{{ end }}
