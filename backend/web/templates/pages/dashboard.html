{{ template "base" . }}

{{ define "content" }}
<div class="max-w-6xl mx-auto">
	<h1 class="text-3xl font-bold mb-6">Active Entities</h1>

	<div class="bg-white shadow rounded-lg p-6">
		<div class="flex justify-between items-center mb-4">
			<h2 class="text-xl font-semibold">Recent Records</h2>

			<button hx-get="/ui/entities/fragment" hx-target="#entity-tbody"
				class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
				Refresh Data
			</button>
		</div>

		<table class="w-full text-left border-collapse">
			<thead>
				<tr class="border-b">
					<th class="py-2">ID</th>
					<th class="py-2">Schema ID</th>
					<th class="py-2">Data payload</th>
					<th class="py-2">Actions</th>
				</tr>
			</thead>
			<tbody id="entity-tbody">
				{{ template "entity_rows" .Entities }}
			</tbody>
		</table>
	</div>
</div>
{{ end }}
