{{ define "entity_rows" }}
{{ range . }}
<tr class="border-b hover:bg-gray-50 transition" id="entity-{{ .ID }}">
	<td class="py-3 text-sm text-gray-500">{{ .ID }}</td>
	<td class="py-3">{{ .SchemaID }}</td>
	<td class="py-3 font-mono text-xs">{{ .Data }}</td>
	<td class="py-3">
		<button hx-delete="/ui/entities/{{ .ID }}" hx-target="#entity-{{ .ID }}" hx-swap="outerHTML"
			hx-confirm="Are you sure you want to delete this record?"
			class="text-red-600 hover:text-red-800 text-sm font-semibold">
			Delete
		</button>
	</td>
</tr>
{{ else }}
<tr>
	<td colspan="4" class="py-4 text-center text-gray-500">No entities found.</td>
</tr>
{{ end }}
{{ end }}
