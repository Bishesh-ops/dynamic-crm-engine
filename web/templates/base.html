{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamic CRM Engine</title>
	<script src="https://unpkg.com/htmx.org@1.9.10"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900 font-sans h-screen flex" hx-boosts="true">
	<aside class="w-64 bg-gray-900 text-white flex flex-col">
		<div class="p-6 text-2xl font-bold border-b border-gray-800">CRM Core</div>
		<nav class="p-4 space-y-2">
			<a href="/ui/dashboard" class="block py-2 px-4 rounded hover:bg-gray-800">Dashboard</a>
			<a href="/ui/schemas" class="block py-2 px-4 rounded hover:bg-gray-800">Schema Builder</a>
		</nav>
	</aside>
	<main class="flex-1 p-8 overflow-y-auto">
		{{ template "content" . }}
	</main>
</body>

</html>
{{ end }}
